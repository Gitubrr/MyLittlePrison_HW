version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: prison_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: prison_system
      MYSQL_USER: prison_user
      MYSQL_PASSWORD: prison_pass
    ports:
      - "3306:3306"
    volumes:
      - ./src:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
