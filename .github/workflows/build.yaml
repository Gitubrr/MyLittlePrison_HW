name: Build MySQL Database

on:
  push:
    branches: 
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prison_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Wait for MySQL
        run: sleep 10
      
      - name: Build data creation
        shell: bash
        env:
          MYSQL_PWD: root 
        run: |
          mysql -h 127.0.0.1 -u root < src/init.sql
          echo "db created successfully"